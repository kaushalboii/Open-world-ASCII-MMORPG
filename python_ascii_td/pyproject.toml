[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-tower-defense"
version = "0.1.0"
description = "Tactical ASCII Tower Defense & Wave Siege with exact character-grid pixels, A* maze pathing, dynamic structural damage, and Sprite & VFX Studio"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pygame = ["pygame-ce>=2.5.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
ascii-td = "ascii_tower_defense.__main__:main"

