<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- // [BELLGLASS ARCHIVE] <title>BELLGLASS — The Drowned Province</title> -->
  <!-- // [BELLGLASS ARCHIVE] <meta name="description" content="An open-world Amber P3 Phosphor ASCII story RPG set across the flooded parishes of Marren Valley." /> -->
  <title>IRONCROWN — The Realm in Winter</title>
  <meta name="description" content="A gritty printable-ASCII feudal war, siege, supply-line, and betrayal campaign inspired by dark medieval throne wars." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23050402' stroke='%23e8871c' stroke-width='2'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='21' fill='%23ffcf5c'%3EI%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="terminal-room">
    <!-- // [BELLGLASS ARCHIVE] <section class="crt-frame" aria-label="Bellglass Amber CRT Viewport"> -->
    <section class="crt-frame" aria-label="Ironcrown Amber CRT Viewport">
      <!-- // [BELLGLASS ARCHIVE] <canvas id="crt" width="1144" height="760" aria-label="Bellglass ASCII game canvas"></canvas> -->
      <canvas id="crt" width="1144" height="760" aria-label="Ironcrown ASCII war canvas"></canvas>
    </section>

    <footer class="bezel-strip">
      <!-- // [BELLGLASS ARCHIVE] <span id="crt-status">P3 AMBER 585nm  |  BELLS 0/5</span> -->
      <span id="crt-status">FULL COLOR  |  HOLDS 3/9  |  DAY 1</span>
      <div class="bezel-actions">
        <button id="btn-color" class="bezel-btn" type="button">[O] COLOR: FULL</button>
        <button id="btn-phosphor" class="bezel-btn" type="button">[P] PHOSPHOR: AMBER</button>
        <button id="btn-crt" class="bezel-btn" type="button">[V] CRT GLOW: ON</button>
        <button id="btn-audio" class="bezel-btn" type="button">[`] SOUND: ON</button>
      </div>
    </footer>

    <section class="touch-deck" aria-label="Touch Controls">
      <div class="touch-cluster">
        <button class="touch-key" type="button" data-act="move_w">W</button>
        <button class="touch-key" type="button" data-act="move_n">N</button>
        <button class="touch-key" type="button" data-act="move_s">S</button>
        <button class="touch-key" type="button" data-act="move_e">E</button>
      </div>
      <div class="touch-cluster">
        <!-- // [BELLGLASS ARCHIVE] <button class="touch-key" type="button" data-act="parry">PAR</button> -->
        <!-- // [BELLGLASS ARCHIVE] <button class="touch-key" type="button" data-act="fork">FORK</button> -->
        <button class="touch-key" type="button" data-act="strike">ATK</button>
        <button class="touch-key" type="button" data-act="parry">SHD</button>
        <button class="touch-key" type="button" data-act="volley">VLY</button>
        <button class="touch-key" type="button" data-act="fork">HRN</button>
        <button class="touch-key" type="button" data-act="interact">ACT</button>
        <button class="touch-key" type="button" data-act="ledger">MAP</button>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
