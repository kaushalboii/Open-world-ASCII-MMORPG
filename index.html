<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TINY GLYPHS — 2D ASCII Action Platformer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #060606;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 16px 8px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .tagline {
      font-size: 12px;
      color: #888888;
      letter-spacing: 2px;
    }

    /* Top Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 960px;
      width: 100%;
    }

    .nav-tab {
      background: #111111;
      color: #aaaaaa;
      border: 1px solid #333333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .nav-tab:hover, .nav-tab:focus {
      background: #222222;
      color: #ffffff;
      border-color: #ffffff;
    }

    #gameContainer {
      position: relative;
      border: 2px solid #ffffff;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
      background-color: #050505;
      line-height: 0;
      max-width: 960px;
      width: 100%;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* CRT scanline overlay */
    #gameContainer.crt::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* Mobile virtual touch controls (shown only on touch devices) */
    .mobile-controls {
      display: none;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
      margin-top: 12px;
      gap: 12px;
      touch-action: manipulation;
    }

    @media (hover: none) and (pointer: coarse), (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }
    }

    .dpad, .action-pad {
      display: flex;
      gap: 8px;
    }

    .touch-btn {
      background: #111111;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 12px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .touch-btn:active {
      background: #ffffff;
      color: #000000;
    }

    /* Bottom Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 960px;
      width: 100%;
    }

    .tool-btn {
      background: #0d0d0d;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .tool-btn:hover {
      border-color: #ffffff;
      background: #ffffff;
      color: #000000;
    }

    /* Quick Guide Footer */
    .footer-guide {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #666666;
      line-height: 1.6;
      max-width: 960px;
      border-top: 1px solid #222222;
      padding-top: 10px;
    }

    .footer-guide strong {
      color: #cccccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>† TINY GLYPHS †</h1>
    <div class="tagline">Pure Monospace ASCII 2D Action Platformer</div>
  </header>

  <!-- Clean Top Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-tab" id="tabMenu">🏠 MAIN MENU</button>
    <button class="nav-tab" id="tabPlay">▶ PLAY MISSION</button>
    <button class="nav-tab" id="tabGuide">📖 HOW TO PLAY</button>
    <button class="nav-tab" id="tabVfx">🧪 VFX ARCHIVE</button>
    <button class="nav-tab" id="tabSettings">⚙️ SETTINGS</button>
  </div>

  <!-- Primary Canvas Container -->
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Responsive Mobile Touch Pad -->
  <div class="mobile-controls">
    <div class="dpad">
      <button class="touch-btn" id="btnLeft">◀ LEFT</button>
      <button class="touch-btn" id="btnRight">RIGHT ▶</button>
    </div>
    <div class="action-pad">
      <button class="touch-btn" id="btnJump">JUMP</button>
      <button class="touch-btn" id="btnPunch">PUNCH</button>
      <button class="touch-btn" id="btnFlask">FLASK</button>
    </div>
  </div>

  <!-- Bottom Utility Toolbar -->
  <div class="toolbar">
    <button class="tool-btn" id="themeBtn">THEME: B&W (T)</button>
    <button class="tool-btn" id="bgmBtn">MUSIC: ON (B)</button>
    <button class="tool-btn" id="muteBtn">SFX: ON (M)</button>
    <button class="tool-btn" id="crtBtn">CRT: OFF</button>
  </div>

  <!-- Footer Quick Guide -->
  <div class="footer-guide">
    <strong>[ CONTROLS ]</strong>
    <strong>A / D</strong> or <strong>Arrows</strong>: Run |
    <strong>W / Space</strong>: Jump (Double Jump!) |
    <strong>J / Click</strong>: Straight Punch |
    <strong>K / E</strong>: Poison Flask |
    <strong>ESC</strong>: Pause & Menu
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
